spring.application.name=oracle

# Configurações de Conexão com o H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o Console Web do H2 para Acesso no Navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações do JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Permite que o console seja acessado de fora do container do Codespaces
spring.h2.console.settings.web-allow-others=true

# Se você tiver o Spring Security (verifique no seu pom.xml), 
